function sbtn(t,i,s,pv,on){const o=unl(s);if(s.h&&!o)return '<button disabled>❓  ???  🔒 '+tr('Секретный скин','Secret skin')+'</button>';return '<button data-t="'+t+'" data-i="'+i+'"'+(on?' class="on"':'')+(o?'':' disabled')+'>'+pv+'  '+tr(s.n[0],s.n[1])+(o?(on?' ✔':''):'  🔒 '+tr(s.t[0],s.t[1])+' ('+Math.min(SV[s.k],s.v)+'/'+s.v+')')+'</button>'}
function renderSk(){let r='<h3>'+tr('Коты','Cats')+'</h3>';CS.forEach((s,i)=>{r+=sbtn('c',i,s,s.e[0]+s.e[3]+s.e[7],SV.cs==i)});
r+='<h3>'+tr('Снаряды','Projectiles')+'</h3>';BL.forEach((s,i)=>{r+=sbtn('b',i,s,s.e,SV.bs==i)});$('sl').innerHTML=r}
$('sl').onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const i=+b.dataset.i;if(b.dataset.t=='c')SV.cs=i;else SV.bs=i;save();renderSk()};
$('mp').onclick=()=>goPlay(1);$('mn').onclick=()=>goPlay(0);$('ms').onclick=()=>{show('mm',0);show('sk',1);renderSk()};$('sb').onclick=()=>{show('sk',0);show('mm',1)};
$('pz').onclick=()=>doPause(true);$('pc').onclick=()=>doPause(false);$('pr').onclick=()=>{show('ps',0);paused=false;SV.run=null;reset();save()};$('pm').onclick=goMenu;$('rm').onclick=goMenu;$('wm').onclick=goMenu;$('wc').onclick=()=>{win=false;show('wn',0)};
document.addEventListener('visibilitychange',()=>{if(document.hidden){doPause(true);save()}gsync();if(AC)document.hidden?AC.suspend():AC.resume()});
window.addEventListener('pagehide',save);
document.addEventListener('pointerdown',()=>{if(sysP){sysP=false;gpOn=null}ac()},true);
for(const n of['pointerup','touchend','keydown'])document.addEventListener(n,()=>ac(),true);
for(const n of['contextmenu','selectstart','dragstart','gesturestart'])document.addEventListener(n,e=>e.preventDefault());
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('button'))sfx('click')},true);
function sndLbl(){const t=SV.mute?tr('🔇 Звук: выкл','🔇 Sound: off'):tr('🔊 Звук: вкл','🔊 Sound: on');$('mu').textContent=t;$('pu').textContent=t}
const vs=()=>{$('vm').value=$('vp').value=Math.round(SV.vol*100)};
for(const id of['vm','vp']){$(id).oninput=e=>{SV.vol=e.target.value/100;vs();vol()};$(id).onchange=()=>{save();sfx('click')}}
$('mu').onclick=$('pu').onclick=()=>{SV.mute=SV.mute?0:1;save();sndLbl()};
const pos=ev=>{const r=cv.getBoundingClientRect();return[(ev.clientX-r.left)*W/r.width,(ev.clientY-r.top)*FH/r.height]};
const cellAt=(x,y)=>{const cx=Math.floor((x-GX)/CW),cy=Math.floor((y-GY)/CH);return cx<0||cx>=COLS||cy<0||cy>=ROWS?-1:cy*COLS+cx};
function tapCell(i){if(i<0){sel=-1;return}
if(sel<0){if(cells[i])sel=i;return}
if(sel==i){sel=-1;return}
if(!cells[i]){cells[i]=cells[sel];cells[sel]=0;sel=-1;return}
if(cells[i]==cells[sel]&&cells[i]<MAXL){cells[i]++;cells[sel]=0;sel=-1;SV.merges++;return}
sel=i}
function dropCell(a,b){if(a==b)return;const A=cells[a],B=cells[b];
if(!B){cells[b]=A;cells[a]=0}else if(A==B&&A<MAXL){cells[b]++;cells[a]=0;SV.merges++}else{cells[a]=B;cells[b]=A}}
function takeGift(){gift=null;SV.gifts++;if(Math.random()<.4){const n=20+wave*5;coins+=n;msg='🎁 +'+n+' '+CO}else{const k=Math.random()*4|0;bo[k]++;msg='🎁 +'+BN[k]}msgT=1.5}
function useB(i){if(over||win||pause||paused||scr!='play'||!bo[i])return;bo[i]--;SV.used++;sfx(['shield','frz','bomb','rage'][i]);efx=.4;efc=['120,210,255','50,140,255','255,255,255','255,140,0'][i];
if(i==0)shield+=3;else if(i==1)frz=4;else if(i==2){const dm=K.h0*Math.pow(K.g,Math.max(wave,1)-1)*3;for(const e of enemies){if(e.sh){e.sh=0;say(tr('Панцирь разбит!','Armor broken!'),2)}if(e.y>36){hurt(e,dm);fxs.push({x:e.x,y:e.y,e:'💥',t:.6})}}boom=.3}else rage=8}
for(let i=0;i<4;i++)$('b'+i).onclick=()=>useB(i);
cv.addEventListener('pointerdown',ev=>{if(over||pause||paused||scr!='play')return;const[x,y]=pos(ev);
if(gift&&Math.hypot(x-gift.x,y-gift.y)<36){takeGift();return}
const i=cellAt(x,y);
if(i>=0&&cells[i]){drag=i;dsx=dx=x;dsy=dy=y;moved=false;try{cv.setPointerCapture(ev.pointerId)}catch(e){}}else tapCell(i)});
cv.addEventListener('pointermove',ev=>{if(drag<0)return;const[x,y]=pos(ev);dx=x;dy=y;if(Math.hypot(x-dsx,y-dsy)>10)moved=true});
cv.addEventListener('pointerup',ev=>{if(drag<0)return;const[x,y]=pos(ev),a=drag;drag=-1;if(moved){const b=cellAt(x,y);if(b>=0)dropCell(a,b);sel=-1}else tapCell(a)});
cv.addEventListener('pointercancel',()=>{drag=-1});

let last=0;
function loop(t){fit();const dt=Math.min(.05,(t-last)/1000||0);last=t;if(!over&&!win&&!pause&&!sysP&&!paused&&scr=='play'&&!document.hidden)step(dt);draw();ui();vol();gsync();requestAnimationFrame(loop)}
function texts(){let l='';try{l=ysdk.environment.i18n.lang}catch(e){}l=l||navigator.language||'ru';
T=/^(ru|be|kk|uk|uz)/.test(l)?TX.ru:TX.en;document.documentElement.lang=tr('ru','en');document.title=tr('Коты против динозавров','Cats vs Dinosaurs');
$('hint').textContent=T.hint;T.bt.forEach((s,i)=>{$('b'+i).title=s});$('rv').textContent=T.cont;$('rs').textContent=T.again;
[['rm','🏠 В меню','🏠 Menu'],['wm','🏠 В меню','🏠 Menu'],['wc','▶ Бесконечный режим','▶ Endless mode'],['mn','🔄 Новая игра','🔄 New game'],['ms','🎨 Скины и задания','🎨 Skins & tasks'],['sb','← Назад','← Back'],['st','Скины','Skins'],['pt','Пауза','Paused'],['pc','▶ Продолжить','▶ Resume'],['pr','🔄 Заново','🔄 Restart'],['pm','🏠 В меню','🏠 Menu']].forEach(a=>{$(a[0]).textContent=tr(a[1],a[2])});
$('pz').setAttribute('aria-label',tr('Пауза','Pause'));sndLbl();mrec();if(scr=='play')fitHint()}
function ready(){try{ysdk.features.LoadingAPI.ready()}catch(e){}}
function load(){try{const o=JSON.parse(localStorage.getItem('mcSave'));if(o&&typeof o=='object')for(const k in SV)if(k=='u'){if(Array.isArray(o.u))SV.u=o.u.filter(x=>typeof x=='string')}else if(k!='run'&&typeof o[k]=='number'&&isFinite(o[k])&&o[k]>=0)SV[k]=o[k];const r=o&&o.run,ok=v=>typeof v=='number'&&isFinite(v)&&v>=0,ia=(a,n,m)=>Array.isArray(a)&&a.length==n&&a.every(v=>v===(v|0)&&v>=0&&v<=m);
if(r&&typeof r=='object'&&ia(r.c,N,MAXL)&&ia(r.bo,4,999)&&[r.w,r.co,r.b,r.hp,r.sh].every(ok)&&r.hp>=1&&r.w>=1&&r.w===(r.w|0))SV.run={w:r.w,c:r.c,co:r.co,b:r.b,hp:r.hp,bo:r.bo,rv:r.rv?1:0,be:r.be?1:0,sh:r.sh}}catch(e){}
if(!CS[SV.cs]||!unl(CS[SV.cs]))SV.cs=0;if(!BL[SV.bs]||!unl(BL[SV.bs]))SV.bs=0;SV.vol=Math.min(1,SV.vol);SV.mute=SV.mute?1:0;lsv=JSON.stringify(SV)}
function boot(){if(started)return;started=true;load();texts();vs();reset(1);goMenu();ready();requestAnimationFrame(loop)}
if(typeof YaGames!=='undefined'){const to=setTimeout(boot,8000);YaGames.init().then(s=>{clearTimeout(to);ysdk=s;hook();if(started){texts();ready()}else boot()}).catch(()=>{clearTimeout(to);boot()})}else boot();
</script></body></html>
